name: Publish plugin release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: writing-dashboard-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Package plugin
        shell: bash
        run: |
          version=$(node -p 'require("./manifest.json").version')
          node -e 'const v = require("./manifest.json").version; if (!/^\d+\.\d+\.\d+$/.test(v) || v !== require("./package.json").version || v !== require("./package-lock.json").version) throw Error("Inconsistent release version")'
          mkdir -p dist/writing-dashboard
          cp main.js manifest.json styles.css THIRD-PARTY-NOTICES.txt dist/writing-dashboard/
          cd dist
          zip -qr "writing-dashboard-$version.zip" writing-dashboard
          sha256sum "writing-dashboard-$version.zip" > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const target = { owner, repo };
            const tag = JSON.parse(fs.readFileSync('manifest.json', 'utf8')).version;
            const notes = fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m)
              .find(section => section.startsWith('[' + tag + ']'));
            if (!notes) throw new Error('Missing changelog entry for ' + tag);
            const body = notes.split('\n').slice(1).join('\n').trim();
            const releases = await github.paginate(github.rest.repos.listReleases, { ...target, per_page: 100 });
            let release = releases.find(item => item.tag_name === tag);
            if (release && !release.draft) {
              core.info('Already published: ' + release.html_url);
              return;
            }
            if (!release) {
              try {
                const { data: ref } = await github.rest.git.getRef({ ...target, ref: 'tags/' + tag });
                if (ref.object.sha !== context.sha) throw new Error('Existing tag points to another commit.');
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              ({ data: release } = await github.rest.repos.createRelease({
                ...target, tag_name: tag, target_commitish: context.sha,
                name: 'Writing Dashboard ' + tag, body, draft: true, prerelease: false,
              }));
            } else if (release.target_commitish !== context.sha) {
              throw new Error('The existing draft was built from another commit.');
            }
            const release_id = release.id;
            const zip = 'writing-dashboard-' + tag + '.zip';
            const names = ['main.js', 'manifest.json', 'styles.css', 'THIRD-PARTY-NOTICES.txt', zip, 'SHA256SUMS.txt'];
            for (const name of names) {
              const prior = release.assets.find(asset => asset.name === name);
              if (prior) await github.rest.repos.deleteReleaseAsset({ ...target, asset_id: prior.id });
              const data = fs.readFileSync('dist/' + (name === zip || name === 'SHA256SUMS.txt' ? name : 'writing-dashboard/' + name));
              await github.rest.repos.uploadReleaseAsset({
                ...target, release_id, name, data,
                headers: { 'content-type': name === zip ? 'application/zip' : 'application/octet-stream' },
              });
            }
            const { data: published } = await github.rest.repos.updateRelease({
              ...target, release_id, draft: false, make_latest: 'true',
            });
            core.notice('Published ' + published.html_url);

